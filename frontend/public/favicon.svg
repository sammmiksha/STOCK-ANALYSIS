<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
    <!-- Rounded green gradient square background -->
    <rect width="24" height="24" rx="5" fill="url(#greenGrad)" />
    
    <!-- Rising stock trend chart lines in dark color -->
    <g transform="translate(3, 3) scale(0.75)">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" stroke="#060810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="16 7 22 7 22 13" stroke="#060810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <defs>
        <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22c55e" />
            <stop offset="100%" stop-color="#16a34a" />
        </linearGradient>
    </defs>
</svg>